<style>
/* Bố cục: thanh bên trái + một cột nội dung ở máy tính; thanh 5 mục cố định ở dưới trên điện thoại.
   Chữ đổi cỡ bằng font-size gốc, mọi kích thước dùng rem để nút và chữ lớn lên cùng nhau. */
:root{
  --bg:#F5EDDD; --surface:#FFFCF5; --surface2:#F8F1E3; --ink:#1E2933; --ink2:#4A5A66; --line:#CBBE9F;
  --primary:#2B5675; --primary-hi:#3F6D91; --primary-ink:#FFFFFF; --primary-soft:#DDE9F1; --primary-deep:#1D3F58;
  --sos:#C0392B; --sos-hi:#D44B3B; --sos-ink:#FFFFFF; --sos-soft:#FBE3DE;
  --amber:#E9A23B; --amber-soft:#FCEBC8;
  --ok:#2D7A4B; --ok-soft:#DDEFE2; --warn:#9C5200; --warn-soft:#FCE5C6; --bad:#B3261E; --bad-soft:#FADDD8;
  --raise:0 1px 0 rgba(255,255,255,.7) inset,0 3px 0 rgba(60,45,20,.16),0 8px 16px rgba(60,45,20,.14);
  --raise-p:0 1px 0 rgba(255,255,255,.25) inset,0 3px 0 rgba(0,0,0,.28),0 9px 16px rgba(29,63,88,.30);
  --raise-s:0 1px 0 rgba(255,255,255,.35) inset,0 3px 0 rgba(0,0,0,.28),0 9px 16px rgba(160,40,25,.32);
  --pressed:0 2px 5px rgba(0,0,0,.28) inset;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 0 rgba(60,45,20,.08),0 10px 24px rgba(60,45,20,.12);
  --bw:2px; --r:1.1rem;
  --f-display:'Bitter',Georgia,'Times New Roman',serif;
  --f-body:'Be Vietnam Pro',system-ui,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12202B; --surface:#1B2E3C; --surface2:#223847; --ink:#F3EEE3; --ink2:#C5CDD3; --line:#42596A;
  --primary:#7FB2D6; --primary-hi:#9CC6E3; --primary-ink:#0E2433; --primary-soft:#24425A; --primary-deep:#BFDDF1;
  --sos:#FF7062; --sos-hi:#FF8C80; --sos-ink:#2A0603; --sos-soft:#40201C; --amber:#F5B84A; --amber-soft:#3A2E12;
  --ok:#6FD893; --ok-soft:#173826; --warn:#FFB066; --warn-soft:#3B2810; --bad:#FF8A80; --bad-soft:#3E1D1A;
  --raise:0 1px 0 rgba(255,255,255,.08) inset,0 3px 0 rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.4);
  --raise-p:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.45);
  --raise-s:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.45);
  --pressed:0 2px 6px rgba(0,0,0,.6) inset;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 0 rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12202B; --surface:#1B2E3C; --surface2:#223847; --ink:#F3EEE3; --ink2:#C5CDD3; --line:#42596A;
  --primary:#7FB2D6; --primary-hi:#9CC6E3; --primary-ink:#0E2433; --primary-soft:#24425A; --primary-deep:#BFDDF1;
  --sos:#FF7062; --sos-hi:#FF8C80; --sos-ink:#2A0603; --sos-soft:#40201C; --amber:#F5B84A; --amber-soft:#3A2E12;
  --ok:#6FD893; --ok-soft:#173826; --warn:#FFB066; --warn-soft:#3B2810; --bad:#FF8A80; --bad-soft:#3E1D1A;
  --raise:0 1px 0 rgba(255,255,255,.08) inset,0 3px 0 rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.4);
  --raise-p:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.45);
  --raise-s:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 rgba(0,0,0,.5),0 8px 16px rgba(0,0,0,.45);
  --pressed:0 2px 6px rgba(0,0,0,.6) inset;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 0 rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.4); color-scheme:dark}
@media (prefers-color-scheme:light){:root[data-contrast="high"]:not([data-theme="dark"]){--ink:#000;--ink2:#14202B;--line:#2A3A47;--bw:3px}}
:root[data-theme="light"][data-contrast="high"]{--ink:#000;--ink2:#14202B;--line:#2A3A47;--bw:3px}
:root[data-contrast="high"]{--bw:3px}

*{box-sizing:border-box}
html{font-size:22px;-webkit-text-size-adjust:100%}
html[data-size="1"]{font-size:19px}
html[data-size="3"]{font-size:26px}
html[data-size="4"]{font-size:30px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;padding-inline:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:800}
h1{font-size:1.7rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--amber);outline-offset:3px;border-radius:.5rem}
svg{display:block}
.ic{width:1.5rem;height:1.5rem;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* khung ứng dụng */
.shell{display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:1.25rem;max-width:80rem;margin:0 auto;padding:1rem}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - 2rem);margin-top:0;background:var(--surface);border:var(--bw) solid var(--line);border-radius:1.6rem;padding:1.1rem .9rem;display:flex;flex-direction:column;gap:.4rem;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem 1rem}
.brand-mark{width:2.6rem;height:2.6rem;border-radius:.8rem;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.brand b{font-family:var(--f-display);font-size:1.25rem;line-height:1.1;display:block}
.brand small{display:block;color:var(--ink2);font-size:.62rem;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:.35rem}
.nav a{display:flex;align-items:center;gap:.8rem;min-height:3.5rem;padding:.55rem .9rem;border-radius:1rem;text-decoration:none;color:var(--ink);font-weight:600;border:var(--bw) solid transparent}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:.6rem}
.main{min-width:0;display:flex;flex-direction:column;gap:1rem;padding-bottom:1rem}

/* thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--bg);padding:.3rem 0 .5rem}
.top h1{font-size:1.45rem;flex:1 1 8rem;min-width:0}
.sizer{display:flex;align-items:center;border:var(--bw) solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.sizer button{min-width:2.9rem;min-height:2.9rem;font-weight:700;display:grid;place-items:center}
.sizer button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sizer .s1{font-size:.8rem}.sizer .s2{font-size:1rem}.sizer .s3{font-size:1.25rem}
.sos-pill{display:flex;align-items:center;gap:.5rem;min-height:3rem;padding:.4rem 1.1rem;border-radius:999px;background:var(--sos);color:var(--sos-ink);font-weight:800;letter-spacing:.02em;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.sos-pill:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

/* nút và thẻ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.4rem;padding:.6rem 1.3rem;border-radius:1rem;font-weight:700;text-decoration:none;border:var(--bw) solid var(--primary);background:var(--primary);color:var(--primary-ink);text-align:center}
.btn.alt{background:var(--surface);color:var(--primary-deep);border-color:var(--primary)}
.btn.sos{background:var(--sos);border-color:var(--sos);color:var(--sos-ink)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:4.2rem;font-size:1.15rem}
.btn:active{transform:translateY(1px)}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:1.1rem;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.small{font-size:.8rem}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.note{display:flex;gap:.7rem;align-items:flex-start;background:var(--amber-soft);border:var(--bw) solid var(--amber);border-radius:var(--r);padding:.8rem 1rem}
.note .x{margin-left:auto;min-width:2.8rem;min-height:2.8rem;display:grid;place-items:center;border-radius:.8rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .7rem;border-radius:999px;font-weight:700;font-size:.8rem}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mut{background:var(--surface2);color:var(--ink2)}

/* chọn chuyên đề */
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.topic{display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:.8rem .4rem;min-height:7rem;border-radius:var(--r);background:var(--surface);border:var(--bw) solid var(--line);font-weight:700;text-align:center;line-height:1.2}
.topic .pic{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-deep)}
.topic[aria-selected="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary)}
.topic[aria-selected="true"] .pic{background:var(--primary);color:var(--primary-ink)}

/* mô hình tương tác */
.stage{position:relative;border-radius:1.5rem;border:var(--bw) solid var(--line);background:radial-gradient(circle at 50% 38%,var(--primary-soft),var(--surface) 70%);overflow:hidden}
.stage svg.model{width:100%;max-height:30rem;height:auto;margin:0 auto}
.hot{position:absolute;width:3.3rem;height:3.3rem;transform:translate(-50%,-50%);border-radius:50%;background:var(--amber);color:#2B1B00;border:4px solid var(--surface);font-weight:800;font-size:1.05rem;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.hot::after{content:"";position:absolute;inset:-.55rem;border-radius:50%;border:3px solid var(--amber);opacity:.7;animation:ping 2s ease-out infinite}
.hot[aria-pressed="true"]{background:var(--sos);color:#fff}
.hot[aria-pressed="true"]::after{border-color:var(--sos)}
@keyframes ping{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.stage-hint{position:absolute;left:.8rem;bottom:.8rem;right:.8rem;display:flex;gap:.5rem;align-items:center;font-size:.75rem;font-weight:600;color:var(--ink2);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:.35rem .7rem;border-radius:999px;width:fit-content;max-width:100%}
.info h2{margin-bottom:.4rem}
.info .blk{padding-top:.8rem;margin-top:.8rem;border-top:var(--bw) dashed var(--line)}
.info h3{display:flex;gap:.5rem;align-items:center;margin-bottom:.3rem}
.tags{display:flex;flex-wrap:wrap;gap:.45rem}
.alertbox{display:flex;gap:.7rem;border-radius:var(--r);padding:.9rem 1rem;background:var(--sos-soft);border:var(--bw) solid var(--sos)}
.alertbox b{color:var(--bad)}

/* hàng lối vào lớn */
.bigrow{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;min-height:4.6rem;padding:.7rem .9rem;border-radius:var(--r);background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.bigrow .pic{width:3.2rem;height:3.2rem;border-radius:.9rem;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-deep);flex:none}
.bigrow .t{font-weight:700;line-height:1.3;flex:1;min-width:0}
.bigrow .t small{display:block;font-weight:500;color:var(--ink2);font-size:.75rem}
.bigrow>.ic:last-child{color:var(--ink2)}
.bigrow.red{background:var(--sos-soft);border-color:var(--sos);color:var(--bad)}
.bigrow.red .pic{background:var(--sos);color:var(--sos-ink)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-top:.4rem}

/* hôm nay */
.hello{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;background:var(--primary);color:var(--primary-ink);border-radius:1.5rem;padding:1.2rem;border:var(--bw) solid var(--primary-deep)}
.hello .muted{color:inherit;opacity:.88}
.ring{position:relative;width:6.6rem;height:6.6rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.q{display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;font-size:.78rem;text-align:center;line-height:1.2;text-decoration:none;color:inherit}
.q .pic{width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--line);color:var(--primary-deep);box-shadow:var(--shadow)}
.q .pic .ic{width:2rem;height:2rem}
.q.red .pic{background:var(--sos);border-color:var(--sos);color:var(--sos-ink)}
.task{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;min-height:4.4rem;padding:.7rem .9rem;border-radius:var(--r);background:var(--surface);border:var(--bw) solid var(--line)}
.task .box{width:2.4rem;height:2.4rem;border-radius:.7rem;border:3px solid var(--primary);display:grid;place-items:center;flex:none;color:transparent}
.task[aria-checked="true"]{background:var(--ok-soft);border-color:var(--ok)}
.task[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task[aria-checked="true"] .lbl{text-decoration:line-through;text-decoration-thickness:2px}
.task .lbl{flex:1;min-width:0;font-weight:700;line-height:1.3}
.task .lbl small{display:block;font-weight:500;color:var(--ink2);font-size:.75rem;text-decoration:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem}
.day{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.5rem .1rem;border-radius:.9rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;font-size:.75rem}
.day .bar{width:1.5rem;height:3.2rem;border-radius:.5rem;background:var(--surface2);border:2px solid var(--line);display:flex;align-items:flex-end;overflow:hidden}
.day .bar i{display:block;width:100%;background:var(--primary)}
.day.today{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.stat{padding:.9rem;border-radius:var(--r);background:var(--surface);border:var(--bw) solid var(--line);text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink2);font-weight:600}

/* tập nhẹ */
.ex{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;padding:.8rem;border-radius:var(--r);background:var(--surface);border:var(--bw) solid var(--line);box-shadow:var(--shadow);min-height:6rem}
.ex .fig{width:5.2rem;height:5.2rem;border-radius:1rem;background:var(--primary-soft);color:var(--primary-deep);flex:none;display:grid;place-items:center}
.ex .fig svg{width:4.4rem;height:4.4rem}
.ex .t{flex:1;min-width:0;font-weight:700;line-height:1.3}
.ex .t small{display:block;font-weight:500;color:var(--ink2);font-size:.75rem;margin-top:.15rem}
.guide{text-align:center;display:flex;flex-direction:column;gap:.9rem;align-items:center}
.guide .fig{width:min(14rem,70%);aspect-ratio:1;border-radius:1.6rem;background:var(--primary-soft);color:var(--primary-deep);display:grid;place-items:center}
.guide .fig svg{width:80%;height:80%}
.counter{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.6rem;text-align:left;width:100%;counter-reset:s}
.steps li{display:flex;gap:.8rem;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.meter{width:100%;height:1rem;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);width:0;transition:width .3s}

/* số đo */
.seg{display:flex;gap:.5rem;flex-wrap:wrap}
.seg button{min-height:3.2rem;padding:.4rem 1.2rem;border-radius:999px;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stepper{display:grid;grid-template-columns:3.6rem minmax(0,1fr) 3.6rem;gap:.6rem;align-items:center}
.stepper button{min-height:3.6rem;border-radius:1rem;background:var(--primary-soft);color:var(--primary-deep);border:var(--bw) solid var(--primary);display:grid;place-items:center}
.stepper .val{text-align:center;font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stepper .val small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:600;color:var(--ink2);margin-top:.2rem}
.faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.35rem}
.faces button{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.4rem .1rem;border-radius:.9rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;font-size:.72rem;line-height:1.15;text-align:center;min-height:5rem}
.faces button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary)}
.faces svg{width:2.4rem;height:2.4rem}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink2);font-family:var(--f-body);font-size:11px;font-weight:600}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.78rem;font-weight:600}
.legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;margin-right:.35rem;vertical-align:-.1rem}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.2rem .8rem;align-items:center;padding:.8rem 0;border-top:var(--bw) solid var(--line)}
.rec:first-child{border-top:0}
.rec .bp{font-family:var(--f-display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.rec .when{font-size:.75rem;color:var(--ink2);font-weight:600}
.bpbands{display:flex;flex-direction:column;gap:.35rem}
.band{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;border-radius:.9rem;font-weight:700;line-height:1.25}
.band small{display:block;font-weight:500;font-size:.72rem}
.band i{width:.9rem;height:.9rem;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-weight:700}
.input{width:100%;min-height:3.4rem;padding:.6rem .9rem;border-radius:1rem;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.switch{display:flex;align-items:center;gap:1rem;justify-content:space-between;min-height:4rem;padding:.6rem .9rem;border-radius:var(--r);background:var(--surface);border:var(--bw) solid var(--line);width:100%;text-align:left;font-weight:700}
.switch small{display:block;font-weight:500;color:var(--ink2);font-size:.75rem}
.tog{width:3.6rem;height:2.1rem;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch[aria-checked="true"] .tog{background:var(--primary)}
.switch[aria-checked="true"] .tog::after{transform:translateX(1.5rem)}

/* bài học và hộp thoại */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:min(42rem,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:1.6rem 1.6rem 0 0;padding:1.2rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom,0px));border:var(--bw) solid var(--line);display:flex;flex-direction:column;gap:.9rem}
.sheet-h{display:flex;align-items:flex-start;gap:.6rem;position:sticky;top:-1.2rem;background:var(--surface);padding:.2rem 0 .5rem;z-index:2}
.sheet-h h2{flex:1;min-width:0}
.xbtn{min-width:3.2rem;min-height:3.2rem;border-radius:50%;background:var(--surface2);border:var(--bw) solid var(--line);display:grid;place-items:center;flex:none}
.lesson h3{margin:1rem 0 .3rem}
.lesson ul{margin:.3rem 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}
.lesson p+p{margin-top:.5rem}
.sosnum{display:grid;gap:.7rem}
.callbig{display:flex;align-items:center;justify-content:center;gap:.8rem;min-height:5rem;border-radius:1.2rem;background:var(--sos);color:var(--sos-ink);font-weight:800;font-size:1.5rem;text-decoration:none;text-align:center;line-height:1.1}
.callbig.alt{background:var(--primary);color:var(--primary-ink);font-size:1.2rem}
.toast{position:fixed;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:999px;font-weight:700;max-width:92vw;text-align:center;box-shadow:var(--shadow)}
.fast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.fast div{padding:.7rem;border-radius:1rem;background:var(--surface2);border:var(--bw) solid var(--line);font-size:.85rem;line-height:1.35}
.fast b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--bad)}

/* thanh dưới cho điện thoại */
.bnav{display:none}
@media (max-width:56rem){
  html{font-size:20px}html[data-size="1"]{font-size:17px}html[data-size="3"]{font-size:23px}html[data-size="4"]{font-size:26px}
  .shell{grid-template-columns:minmax(0,1fr);padding:.8rem 1rem calc(5.8rem + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:var(--bw) solid var(--line);padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:4.2rem;text-decoration:none;color:var(--ink2);font-weight:700;font-size:.62rem;border-radius:1rem;line-height:1.1;text-align:center}
  .bnav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}
  .toast{bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:flex-end}
}
@media (max-width:30rem){
  .top h1{flex-basis:100%;order:3}
  .hello{grid-template-columns:1fr}
  .hello .ring{justify-self:start}
  .topics{gap:.5rem}
  .hot{width:3rem;height:3rem}
}
@media (min-width:56.01rem){.scrim{align-items:center}.sheet{border-radius:1.6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* bổ sung: mô hình, danh sách trong thẻ */
.stage{aspect-ratio:5/6;max-width:27rem;width:100%;margin-inline:auto}
.stage svg.model{position:absolute;inset:0;width:100%;height:100%;max-height:none}
.topics{grid-template-columns:repeat(4,minmax(0,1fr))}
.topic .pic .ic{width:1.9rem;height:1.9rem}
.m-body{fill:var(--primary-soft);stroke:var(--primary-deep);stroke-width:3}
.m-v{fill:var(--surface);stroke:var(--primary-deep);stroke-width:3}
.m-num{font-family:var(--f-display);font-weight:800;font-size:50px;fill:var(--ink)}
.m-lab{font-family:var(--f-body);font-weight:700;font-size:12px;fill:var(--ink2);letter-spacing:.08em}
.m-lab2{font-family:var(--f-body);font-weight:700;font-size:15px;fill:var(--ink2)}
.m-lab2.on{fill:var(--bad);font-weight:800}
.info ul{margin:.3rem 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem}
.alertbox p+p{margin-top:.4rem}
.callbig small{display:block}
.stage-hint .ic{width:1.1rem;height:1.1rem}
@media (max-width:30rem){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}.topic{flex-direction:row;justify-content:flex-start;text-align:left;min-height:4.6rem;padding:.6rem .8rem}.topic .pic{width:2.9rem;height:2.9rem;flex:none}}

/* ====== Hôm nay: thanh ngày, buổi, thẻ việc ====== */
.datecard{border:var(--bw) solid var(--line);border-radius:1.5rem;padding:1.1rem;background:linear-gradient(165deg,var(--primary-soft),var(--surface) 75%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.9rem}
.dc-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.arrows{display:flex;gap:.5rem;flex:none}
.dpills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem}
.dp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;min-height:5rem;padding:.4rem 0;border-radius:999px;background:var(--surface);border:var(--bw) solid var(--line);font-weight:700;min-width:0}
.dp .dw{font-size:.68rem;color:var(--ink2)}
.dp .dn{font-family:var(--f-display);font-size:1.05rem;font-weight:800;line-height:1}
.dd{display:block;width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}
.dd.ok{background:var(--ok)}.dd.part{background:var(--amber)}.dd.miss{background:var(--bad)}.dd.none{background:transparent}
.dp.today{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dp.today .dw{color:var(--bg);opacity:.85}
.dp.sel{box-shadow:0 0 0 3px var(--primary)}
.dp.sel:not(.today){background:var(--primary-soft);border-color:var(--primary)}
.pill.today-pill{background:var(--ink);color:var(--bg);font-size:.85rem}
.ptabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}
.ptabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.7rem;padding:.3rem .2rem;border-radius:1rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;line-height:1.15}
.ptabs small{font-size:.7rem;font-weight:600;color:var(--ink2)}
.ptabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.ptabs button[aria-selected="true"] small{color:var(--primary-ink);opacity:.9}
.pbar{height:1.4rem;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(135deg,var(--primary) 0 10px,color-mix(in srgb,var(--primary) 72%,#fff) 10px 20px);transition:width .35s}
.prog{display:flex;flex-direction:column;gap:.7rem}
.per{display:flex;flex-direction:column;gap:.8rem}
.per-h{display:flex;align-items:center;gap:.8rem}
.per-h h3{font-size:1.3rem}
.pi{width:3rem;height:3rem;border-radius:50%;background:var(--amber-soft);color:var(--warn);border:var(--bw) solid var(--amber);display:grid;place-items:center;flex:none}
.per-list{display:flex;flex-direction:column;gap:.7rem;margin-left:1.4rem;padding-left:1rem;border-left:4px solid var(--line)}
.rt{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rt.done{background:var(--ok-soft);border-color:var(--ok)}
.rt.s-late{border-color:var(--bad)}.rt.s-soon{border-color:var(--amber)}
.rt.attn{animation:blinkb 1.2s ease-in-out infinite;border-color:var(--bad)}
@keyframes blinkb{0%,100%{box-shadow:0 0 0 0 rgba(198,42,31,0)}50%{box-shadow:0 0 0 6px rgba(198,42,31,.55)}}
.rt-h{display:flex;align-items:stretch}
.rt-main{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;text-align:left;padding:.8rem .9rem;min-height:5.2rem}
.rg{position:relative;width:3.7rem;height:3.7rem;flex:none}.rg svg{width:100%;height:100%}
.rg-c{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;color:var(--primary-deep)}
.rg-c .ic{width:1.5rem;height:1.5rem}
.rt-t{display:flex;flex-direction:column;gap:.3rem;min-width:0;flex:1}.rt-t b{line-height:1.25}
.rt-s{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.chv{flex:none;transition:transform .15s;color:var(--ink2)}.chv.up{transform:rotate(90deg)}

function bpClass(sys,dia){
  if(sys>=180||dia>=120) return {k:'bad',tag:'Rất cao',msg:'Nghỉ 5 phút rồi đo lại. Nếu vẫn từ 180/120 trở lên, hoặc có đau ngực, khó thở, méo miệng, yếu liệt, nói khó, hãy gọi 115.',crit:true};
  if(sys>=140||dia>=90) return {k:'bad',tag:'Cao độ 2',msg:'Nên báo bác sĩ trong thời gian sớm. Tiếp tục uống thuốc đúng chỉ định, không tự tăng giảm liều.'};
  if(sys>=130||dia>=80) return {k:'warn',tag:'Cao độ 1',msg:'Đo lại vài ngày liên tiếp, ghi lại và trao đổi với bác sĩ ở lần khám tới.'};
  if(sys>=120) return {k:'warn',tag:'Hơi cao',msg:'Giữ nếp sống lành mạnh, vận động nhẹ và đo đều.'};
  if(sys<90||dia<60) return {k:'warn',tag:'Hơi thấp',msg:'Nếu thấy choáng, hoa mắt, hãy ngồi nghỉ, đứng dậy từ từ. Báo bác sĩ nếu hay bị.'};
  return {k:'ok',tag:'Bình thường',msg:'Rất tốt. Tiếp tục giữ nếp sống lành mạnh và đo đều.'};
}

function dkey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(k){ const a=k.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoDow(d){ return ((d.getDay()+6)%7)+1; }
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-(isoDow(x)-1)); return x; }
function pad(n){ return String(n).padStart(2,'0'); }
function lastDays(n){ const out=[]; const now=new Date(); for(let i=n-1;i>=0;i--) out.push(addDays(now,-i)); return out; }
function fmtDate(t){ const d=new Date(t); return DAYS[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+' lúc '+pad(d.getHours())+':'+pad(d.getMinutes()); }

function seed(){
  const now=new Date(), readings=[], log={}, demoDays=[];
  const from=dkey(addDays(now,-7));
  const routines=sampleRoutines(from);
  const vals=[[138,86,74,5,'Cổ vai gáy'],[142,88,76,4,'Cổ vai gáy'],[135,84,72,4,'Thắt lưng'],[130,82,70,3,'Cổ vai gáy'],[128,80,72,3,'Lưng'],[132,84,75,4,'Cổ vai gáy'],[126,79,71,2,'Cổ vai gáy']];
  const frac=[.6,.8,.4,1,.8,.6,.8];
  for(let i=7,k=0;i>=1;i--,k++){
    const d=addDays(now,-i); d.setHours(7,30,0,0); const v=vals[k];
    readings.push({id:'d'+k,t:d.getTime(),sys:v[0],dia:v[1],pulse:v[2],pain:v[3],loc:v[4],note:'',demo:true});
    const key=dkey(d); demoDays.push(key); log[key]={};
    const due=routines.filter(r=>dueOn(r,key)); const n=Math.round(due.length*frac[k]);
    due.slice(0,n).forEach(r=>{ log[key][r.id]=itemIds(r); });
  }
  const S0={size:2,contrast:false,tts:true,name:'',contacts:[],lastExport:0,routines:routines,log:log,demoDays:demoDays,readings:readings,noteOff:false,sampleOff:false,remindOn:true,sound:true,wake:false,fired:{}};
  const tk=dkey(now);
  routines.forEach(r=>{ if(dueOn(r,tk)) alertSchedule(r,tk).forEach(a=>{ if(a.t<=now.getTime()) S0.fired[tk+'|'+r.id+'|'+a.i]=1; }); });
  return S0;
}
function arr(x){ return Array.isArray(x)?x:[]; }
function fixState(o){
  const base=seed(); o=o||{};
  const out=Object.assign({},base);
  ['size','contrast','tts','name','noteOff','sampleOff','remindOn','sound','wake','lastExport'].forEach(k=>{ if(o[k]!==undefined&&o[k]!==null) out[k]=o[k]; });
  out.size=Math.min(4,Math.max(1,+out.size||2));
  out.name=String(out.name||'').slice(0,60);
  out.lastExport=+out.lastExport||0;
  out.routines=o.routines?arr(o.routines).filter(r=>r&&r.id&&r.time).map(r=>{ r.items=arr(r.items); r.repeat=r.repeat||{type:'daily',days:[],dates:[],date:''}; r.remind=r.remind||{on:false,lead:0,count:1,gap:10}; r.from=r.from||dkey(); r.title=String(r.title||'Việc'); r.period=r.period||'sang'; return r; }):base.routines;
  out.readings=o.readings?arr(o.readings).filter(r=>r&&typeof r.t==='number'):base.readings;
  out.log=(o.log&&typeof o.log==='object'&&!Array.isArray(o.log))?o.log:{};
  out.demoDays=o.demoDays?arr(o.demoDays):[];
  if(!o.routines&&!o.readings){ out.log=base.log; out.demoDays=base.demoDays; }
  else if(o.readings&&!o.routines&&!o.readings.some(r=>r.demo)){ out.demoDays=[]; out.log={}; }
  out.fired=(o.fired&&typeof o.fired==='object')?o.fired:{};
  let c=arr(o.contacts).filter(x=>x&&x.phone).map(x=>({id:x.id||rid(),name:String(x.name||'').slice(0,40),phone:String(x.phone).slice(0,24),rel:String(x.rel||'').slice(0,30)}));
  if(!c.length&&o.relPhone) c=[{id:rid(),name:String(o.relName||'Người thân').slice(0,40),phone:String(o.relPhone).slice(0,24),rel:''}];
  out.contacts=c.slice(0,6);
  ['tts','remindOn','sound'].forEach(k=>{ if(typeof out[k]!=='boolean') out[k]=true; });
  return out;
}
function migrate(o){ return fixState(o); }
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.routines) return fixState(o); } }catch(e){}
  try{ const r=localStorage.getItem(KEY_OLD); if(r){ const o=JSON.parse(r); if(o&&o.readings) return migrate(o); } }catch(e){}
  return null;
}

function applyPrefs(){
  const r=document.documentElement;
  r.setAttribute('data-size',String(S.size));
  if(S.contrast) r.setAttribute('data-contrast','high'); else r.removeAttribute('data-contrast');
  $$('.sizer button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.size===S.size)));

/* ====== Thông báo nhỏ ====== */
let toastT=null;
function toast(msg){ const t=$('#toast'); t.innerHTML='<div class="toast">'+esc(msg)+'</div>'; clearTimeout(toastT); toastT=setTimeout(()=>{t.innerHTML='';},3200); }

/* ====== Giọng đọc ====== */
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('Máy này chưa hỗ trợ giọng đọc'); return; }
    const ss=window.speechSynthesis;
    if(ss.speaking){ ss.cancel(); return; }
    const u=new SpeechSynthesisUtterance(text); u.lang='vi-VN'; u.rate=.85;
    const v=ss.getVoices().find(x=>/^vi/i.test(x.lang)); if(v) u.voice=v;
    ss.speak(u);
  }catch(e){ toast('Không bật được giọng đọc'); }
}
function stopSpeak(){ try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){} }

function holdProgressHTML(e){

function updateHoldProgress(){
 const e=EXERCISES.find(x=>x.id===EX.id),box=document.getElementById('hold-progress');if(!e||!box)return;
 const elapsed=Math.max(0,e.hold-EX.left);box.querySelector('#hold-seconds').textContent=EX.left+' giây';box.querySelector('#hold-phase').textContent='Đang giữ tư thế';
 const track=box.querySelector('[role=progressbar]');track.setAttribute('aria-valuenow',elapsed);track.setAttribute('aria-valuetext',elapsed+' trên '+e.hold+' giây');const fillElapsed=EX.left===0?e.hold:Math.max(0,Math.min(e.hold,(Date.now()-(EX.deadline-e.hold*1000))/1000));box.querySelector('.hold-progress-fill').style.width=(fillElapsed/e.hold*100)+'%';
}
function openEx(id){

  const e=EXERCISES.find(x=>x.id===id);

function refreshEx(){ const b=$('#exbody'); if(b) b.innerHTML=exBody(); }
function exRep(){ const e=EXERCISES.find(x=>x.id===EX.id); clearInterval(holdT); holdT=null; EX.left=0;EX.deadline=0; if(EX.n<e.reps) EX.n++; refreshEx(); }
function exHold(){
 const e=EXERCISES.find(x=>x.id===EX.id);if(!e||!e.hold||EX.n>=e.reps||EX.left>0)return;
 EX.left=e.hold;EX.deadline=Date.now()+e.hold*1000;refreshEx();clearInterval(holdT);
 holdT=setInterval(()=>{EX.left=Math.max(0,Math.ceil((EX.deadline-Date.now())/1000));if(EX.left<=0){updateHoldProgress();try{navigator.vibrate&&navigator.vibrate(120);}catch(_){}exRep();}else updateHoldProgress();},100);
}

function dueOn(r,key){
  if(key<r.from) return false;

function toggleItem(r,k,id){ const L=S.log[k]||(S.log[k]={}); const a=L[r.id]||(L[r.id]=[]); const i=a.indexOf(id); if(i>=0) a.splice(i,1); else a.push(id); save(); }

/* ====== Bộ nhắc việc ====== */
function alertSchedule(r,k){
  const out=[], rm=r.remind; if(!rm||!rm.on) return out;
  const due=dueMs(r,k);
  if(rm.lead>0) out.push({i:0,t:due-rm.lead*6e4,type:'pre'});
  for(let n=0;n<rm.count;n++) out.push({i:1+n,t:due+n*rm.gap*6e4,type:n===0?'due':'late'});
  return out;
}
function attentionList(now){
  const k=dkey(new Date(now));
  return routinesOn(new Date(now)).filter(r=>{
    const rm=r.remind; if(isComplete(r,k)||!rm||!rm.on) return false;
    const due=dueMs(r,k), start=due-rm.lead*6e4, end=due+Math.max(0,rm.count-1)*rm.gap*6e4+30*6e4;
    return now>=start&&now<=end;
  });
}
function msgFor(r,k,now){
  const mins=Math.round((dueMs(r,k)-now)/6e4);
  if(mins>0) return 'Còn '+mins+' phút nữa tới '+r.time+'.';
  if(mins===0) return 'Đã tới giờ '+r.time+'.';
  const m=-mins; return 'Đã quá giờ '+r.time+(m>=60?' hơn '+Math.floor(m/60)+' giờ.':' khoảng '+m+' phút.');
}
function routineState(r,k,now){
  const ck=checkedIds(r,k).length, n=itemIds(r).length, today=dkey(new Date(now));
  if(ck>=n) return {s:'done',t:'Hoàn thành'};
  if(k<today) return {s:'miss',t:ck?'Còn '+(n-ck)+' mục':'Chưa làm'};
  if(k>today) return {s:'later',t:'Hạn '+r.time};
  const due=dueMs(r,k), lead=(r.remind&&r.remind.on?r.remind.lead:0);
  if(now>due) return {s:'late',t:'Quá giờ '+r.time};
  if(now>=due-Math.max(lead,15)*6e4) return {s:'soon',t:'Sắp tới giờ '+r.time};
  return {s:'later',t:(ck?'Còn '+(n-ck)+' mục · ':'')+'Hạn '+r.time};
}

function chartsHTML(list){
  if(!list.length) return '';
  const days=UI.range, from=new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-(days-1));
  const t0=from.getTime(), t1=t0+days*864e5;
  const W=640,H=250,L=42,R=18,T=18,B=30, pw=W-L-R, ph=H-T-B;
  const sy=list.map(r=>r.sys), dy=list.map(r=>r.dia);
  const lo=Math.floor((Math.min(60,Math.min.apply(null,dy)-5))/20)*20, hi=Math.ceil((Math.max(160,Math.max.apply(null,sy)+5))/20)*20;
  const X=t=>L+(t-t0)/(t1-t0)*pw, Y=v=>T+(1-(v-lo)/(hi-lo))*ph;
  let g='';
  for(let v=lo;v<=hi;v+=20){ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'; }
  const step=days===7?1:5;
  for(let i=0;i<days;i+=step){ const d=new Date(t0+i*864e5); g+='<text x="'+X(t0+i*864e5+432e5)+'" y="'+(H-8)+'" text-anchor="middle">'+(days===7?DOW[d.getDay()]:d.getDate()+'/'+(d.getMonth()+1))+'</text>'; }
  const pts=(arr,key)=>arr.map(r=>X(r.t)+','+Y(r[key])).join(' ');
  const dots=(key,col)=>list.map((r,i)=>{ const last=i===list.length-1; return '<circle cx="'+X(r.t)+'" cy="'+Y(r[key])+'" r="'+(last?7:5)+'" fill="'+col+'" stroke="var(--surface)" stroke-width="2.5"/>'+(last?'<text x="'+Math.min(X(r.t),W-R-6)+'" y="'+(Y(r[key])-12)+'" text-anchor="middle" style="fill:'+col+';font-size:14px;font-weight:800">'+r[key]+'</text>':''); }).join('');
  const bp='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ huyết áp trong '+days+' ngày">'+g+
    '<polyline points="'+pts(list,'sys')+'" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<polyline points="'+pts(list,'dia')+'" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>'+dots('sys','var(--primary)')+dots('dia','var(--warn)')+'</svg>';
  const PH=120, py=v=>PH-6-(v/10)*(PH-30);
  const bw=Math.max(10,Math.min(26,pw/days*.5));
  const bars=list.map(r=>{ const c=r.pain>=7?'var(--bad)':r.pain>=4?'var(--warn)':'var(--ok)'; const x=X(r.t);
    return '<rect x="'+(x-bw/2)+'" y="'+py(r.pain)+'" width="'+bw+'" height="'+Math.max(2,PH-6-py(r.pain))+'" rx="5" fill="'+c+'"/><text x="'+x+'" y="'+(py(r.pain)-6)+'" text-anchor="middle" style="fill:'+c+';font-weight:800;font-size:13px">'+r.pain+'</text>'; }).join('');
  const pain='<svg class="chart" viewBox="0 0 '+W+' '+PH+'" role="img" aria-label="Biểu đồ mức đau trên 10"><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(PH-6)+'" y2="'+(PH-6)+'" stroke="var(--line)" stroke-width="2"/>'+bars+'</svg>';
  return '<div class="card stack"><div class="sec-h"><h3>Huyết áp</h3><span class="small muted">mmHg</span></div><div class="legend"><span><i style="background:var(--primary)"></i>Số trên</span><span><i style="background:var(--warn)"></i>Số dưới</span></div>'+bp+'</div>'+
    '<div class="card stack"><div class="sec-h"><h3>Mức đau</h3><span class="small muted">0 là không đau, 10 là đau dữ dội</span></div>'+pain+'</div>';
}

function exportCode(){
  const o={app:'ancotsong',v:2,exported:Date.now(),data:S};
  return 'ANCOTSONG1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function parseImport(text){
  let t=String(text||'').trim();
  if(!t) throw new Error('Bác chưa dán mã nào.');
  let json;
  if(t.indexOf('ANCOTSONG1:')===0){
    try{ json=decodeURIComponent(escape(atob(t.slice(11).replace(/\s+/g,'')))); }catch(e){ throw new Error('Mã bị thiếu hoặc bị cắt. Bác thử sao chép lại đủ cả mã.'); }
  } else if(t[0]==='{') json=t;
  else throw new Error('Đây không phải mã của An Cột Sống.');
  let o; try{ o=JSON.parse(json); }catch(e){ throw new Error('Không đọc được dữ liệu. Mã có thể bị thiếu.'); }
  const d=(o&&o.app==='ancotsong'&&o.data)?o.data:o;
  if(!d||!Array.isArray(d.routines)||!Array.isArray(d.readings)) throw new Error('Mã này không có dữ liệu của An Cột Sống.');
  return {state:fixState(d),when:o&&o.exported||0};
}

let customCodeSource=null, customCodeEnabled=false, customCodeGeneration=null;
const customRenderHooks=new Set();
function customCodeStatus(message){
 let el=document.getElementById('custom-code-status');
 if(!message){if(el)el.remove();return;}
 if(!el){el=document.createElement('p');el.id='custom-code-status';el.className='sync-status';el.setAttribute('role','status');document.querySelector('.main').append(el);}
 el.textContent=message;
}
function notifyCustomRender(){
 for(const hook of [...customRenderHooks])try{hook();}catch(error){console.error('Custom render hook:',error);customCodeStatus('Mã tùy chỉnh có lỗi: '+error.message);}
}
function cleanupCustomCode(){
 const gen=customCodeGeneration;if(!gen)return;
 gen.controller.abort();
 for(const fn of gen.cleanups)try{fn();}catch(error){console.error('Custom cleanup:',error);}
 gen.node.remove();customCodeGeneration=null;
}
function applyCustomCode(settings){
 let style=document.getElementById('sheet-custom-css');
 if(!style){style=document.createElement('style');style.id='sheet-custom-css';document.head.append(style);}
 const css=String(settings.custom_css||'');if(style.textContent!==css)style.textContent=css;
 const source=String(settings.custom_js||'');
 const enabled=String(settings.custom_js_enabled||'').trim().toLowerCase()==='true';
 if(source===customCodeSource&&enabled===customCodeEnabled)return;
 cleanupCustomCode();customCodeSource=source;customCodeEnabled=enabled;customCodeStatus('');
 if(!enabled||!source.trim())return;
 const gen={controller:new AbortController(),cleanups:[],node:document.createElement('script')};customCodeGeneration=gen;
 const api=Object.freeze({
  signal:gen.controller.signal,
  onCleanup(fn){if(typeof fn==='function')gen.cleanups.push(fn);},
  onRender(fn){if(typeof fn!=='function')throw Error('onRender cần một hàm');customRenderHooks.add(fn);gen.cleanups.push(()=>customRenderHooks.delete(fn));},
  getProducts(){return JSON.parse(JSON.stringify(PRODUCTS));},
  getArticles(){return JSON.parse(JSON.stringify(LESSONS));},
  reportError(error){console.error('Custom JavaScript:',error);customCodeStatus('Mã JavaScript tùy chỉnh có lỗi: '+String(error&&error.message||error));}
 });
 window.AnCotSongCustom=api;
 gen.node.id='sheet-custom-js';
 gen.node.textContent='(function(){try{const cleanup=(function(app){"use strict";\n'+source+'\n})(window.AnCotSongCustom);if(typeof cleanup==="function")window.AnCotSongCustom.onCleanup(cleanup);}catch(error){window.AnCotSongCustom.reportError(error);}})();';
 const syntaxError=event=>{api.reportError(event.error||new Error(event.message));};
 window.addEventListener('error',syntaxError);
 try{document.head.append(gen.node);}catch(error){api.reportError(error);}
 finally{window.removeEventListener('error',syntaxError);}
 notifyCustomRender();
}

function youtubeID(value){
 const input=String(value||'').trim();
 if(/^[A-Za-z0-9_-]{11}$/.test(input))return input;
 try{
  const u=new URL(input);if(!/^https?:$/.test(u.protocol))return '';
  const host=u.hostname.toLowerCase();let id='';
  if(host==='youtu.be')id=u.pathname.split('/')[1]||'';
  else if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){
   const parts=u.pathname.split('/').filter(Boolean);
   if(parts[0]==='watch')id=u.searchParams.get('v')||'';
   else if(['embed','shorts','live'].includes(parts[0]))id=parts[1]||'';
  }
  return /^[A-Za-z0-9_-]{11}$/.test(id)?id:'';
 }catch(_){return '';}
}

 if(!topics.length)throw Error('Cần ít nhất một chuyên đề khám phá');
 const exercises=sorted(t.Exercises.filter(published)).map(e=>({...e,reps:Math.max(1,Math.min(100,Number(e.reps)||5)),hold:Math.max(0,Math.min(120,Number(e.hold)||0)),steps:ACSRich.steps(e.steps||'')}));
 const settings=Object.fromEntries(t.Settings.map(r=>[r.key,String(r.value||'')]));anatomySettings=settings;window.AN_PUSH_API=settings.push_api_url||'/push-api';
 cmsTexts=new Map(t.Texts.filter(r=>r.original&&r.value!==undefined).map(r=>[r.original,String(r.value)]));
 cmsTexts.set('An Cột Sống',settings.app_name||'An Cột Sống');cmsTexts.set('Cột sống khỏe, huyết áp ổn',settings.tagline||'Cột sống khỏe, huyết áp ổn');cmsTexts.set('Ứng dụng giúp hiểu và theo dõi, không thay bác sĩ chẩn đoán hay kê thuốc.',settings.disclaimer||'');
 LESSONS=lessons;TOPICS=topics;PRODUCTS=sorted(t.Products.filter(published));
 // Keep an exercise in progress stable until its dialog closes.
 if(!EX.id||!$('#exbody')){EXERCISES=exercises;pendingExercises=null;}else pendingExercises=exercises;
 const tips=sorted(t.Tips).map(r=>String(r.content||''));TIPS=tips.length?tips:[''];EX_SAFETY=settings.exercise_safety||EX_SAFETY;
 UI.topic=Math.min(UI.topic,TOPICS.length-1);UI.spot=Math.min(UI.spot,TOPICS[UI.topic].spots.length-1);
 const lessonId=UI.lessonId, sc=$('#sheet'), top=sc?sc.scrollTop:0;
 if(!(document.activeElement&&document.activeElement.matches('input,textarea,select')))render();
 if(lessonId){if(LESSONS.some(l=>l.id===lessonId)){openLesson(lessonId);$('#sheet').scrollTop=top;}else{closeSheet();toast('Bài viết đã được gỡ khỏi thư viện.');}}
 document.title=settings.app_name||'An Cột Sống';translateCMS(document.body);applyCustomCode(settings);
}
const cmsOriginal=new WeakMap();
function translateCMS(root){if(!cmsTexts.size)return;const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(n.parentElement.closest('script,style,textarea,input,.toast,.sync-status,.product-card,.lesson'))continue;const original=cmsOriginal.get(n)||n.nodeValue;if(!cmsOriginal.has(n))cmsOriginal.set(n,original);const trim=original.trim(),v=cmsTexts.get(original)??cmsTexts.get(trim);if(v!==undefined&&n.nodeValue!==v)n.nodeValue=v;}}
function cmsStatus(text){let el=$('#cms-status');if(!el){el=document.createElement('div');el.id='cms-status';el.className='sync-status';el.setAttribute('role','status');$('.main').append(el);}el.textContent=text;}
function cmsRequest(){return new Promise((resolve,reject)=>{
 const callback='acsCMS_'+Date.now(), script=document.createElement('script');let timer;
 const cleanup=()=>{clearTimeout(timer);script.remove();delete window[callback];};
 window[callback]=data=>{cleanup();resolve(data);};script.onerror=()=>{cleanup();reject(Error('Không kết nối được nguồn dữ liệu'));};
 timer=setTimeout(()=>{cleanup();reject(Error('Hết thời gian chờ'));},12000);
 const url=new URL(CMS_ENDPOINT);url.searchParams.set('callback',callback);url.searchParams.set('t',Date.now());script.src=url.href;document.head.append(script);
});}
async function syncCMS(){if(cmsBusy||document.hidden)return;cmsBusy=true;try{
 const data=await cmsRequest();if(data.error)throw Error(data.error);
 if(data.version!==cmsVersion){applyCMS(data);cmsVersion=data.version;try{localStorage.setItem(CMS_CACHE,JSON.stringify(data));}catch(_){} }
 cmsOK=true;cmsStatus('Đã đồng bộ · '+new Date().toLocaleTimeString('vi-VN')+' · tự kiểm tra mỗi 15 giây');
 }catch(e){cmsStatus('Chưa kết nối được Google Sheet. Đang hiển thị dữ liệu gần nhất; sẽ tự thử lại.');}finally{cmsBusy=false;}}
let cmsStarted=false;
function startCMS(){
 if(cmsStarted)return;cmsStarted=true;
 document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){e.target.hidden=true;}},true);
 new MutationObserver(records=>{for(const r of records)if(r.type==='childList')for(const n of r.addedNodes)if(n.nodeType===1)translateCMS(n);}).observe(document.body,{childList:true,subtree:true});
 if(!CMS_ENDPOINT){cmsStatus('Chế độ dữ liệu mẫu · chưa cấu hình Google Sheet');return;}
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(CMS_ENDPOINT)){cmsStatus('URL nguồn dữ liệu chưa đúng. Dùng URL Apps Script kết thúc bằng /exec.');return;}
 try{const cached=JSON.parse(localStorage.getItem(CMS_CACHE));if(cached){applyCMS(cached);cmsVersion=cached.version;}}catch(_){}
 syncCMS();setInterval(syncCMS,CMS_POLL_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncCMS();});
}

/* ====== Khởi động ====== */
S=load()||seed();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
applyPrefs(); render(); tick(); applyWake(); startCMS();
setInterval(tick,15000);
setInterval(()=>{ if(curRoute().id==='hom-nay'&&!$('#sheet')&&!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input,textarea'))) render(); },60000);
